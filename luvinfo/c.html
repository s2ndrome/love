<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YVAN LIA Index</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Instrument+Sans:wght@400;600&family=Noto+Sans+KR:wght@400;600&display=swap">
<style>
/* C — 인덱스: 포트폴리오 목차처럼 다섯 칸. 큰 회색 숫자, 아래쪽에 누르는 항목. 03 칸에는 분해되는 3D 휠 */
:root {
  --bg: #f4f4f2;
  --ink: #161616;
  --num: #d9d9d6;
  --rule: #a9a9a5;
  --soft: #6b6b67;
  --blue: #2546a8;
  --num-f: "Russo One", "Arial Black", sans-serif;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --ko: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 13px/1.55 var(--sans), var(--ko); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.page { height: 100%; max-width: 1400px; margin: 0 auto; display: grid; grid-template-rows: auto 1fr auto; }
.mast { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 22px 0 18px; font: 400 12px/1.4 var(--sans); color: var(--soft); }
.mast b { color: var(--ink); font: 600 14px/1 var(--sans); letter-spacing: .02em; }
.cols { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0 28px; min-height: 0; padding-bottom: 28px; }
.col { position: relative; border-left: 1.5px solid var(--rule); padding: 0 0 0 16px; display: grid; grid-template-rows: auto auto auto 1fr auto; min-width: 0; }
.n { font: 400 clamp(64px, 8.4vw, 118px)/.8 var(--num-f); color: var(--num); letter-spacing: -.02em; margin-top: -2px; }
.col h2 { margin: 22px 0 0; font: 400 clamp(20px, 1.9vw, 26px)/1.15 var(--sans); letter-spacing: -.01em; text-transform: uppercase; }
.col .pg { margin: 6px 0 0; color: var(--soft); font-size: 14px; font-variant-numeric: tabular-nums; }
.mid { position: relative; min-height: 120px; }
.items { display: grid; gap: 12px; }
.items button { text-align: left; background: none; border: 0; padding: 0; cursor: pointer; display: block; }
.items b { display: block; font: 600 15px/1.3 var(--sans), var(--ko); }
.items span { display: block; font: 400 12.5px/1.55 var(--ko); color: #444; word-break: keep-all; }
.items button:hover b, .items button:focus-visible b { color: var(--blue); }
.items button:focus-visible { outline: 1px solid var(--blue); outline-offset: 4px; }

/* 01: 세로 이름 */
.vert { position: absolute; left: 0; top: 18px; writing-mode: vertical-rl; font: 400 clamp(54px, 6vw, 92px)/1 var(--num-f); color: var(--ink); letter-spacing: -.01em; }
.vert small { font: 400 13px/1 var(--ko); writing-mode: horizontal-tb; display: block; margin-top: 10px; color: var(--soft); }
.plate { position: absolute; right: 0; bottom: 18px; display: inline-flex; border: 1.5px solid var(--ink); font: 600 13px/1.6 var(--sans); gap: 6px; background: #fff; }
.plate i, .plate s { font-style: normal; text-decoration: none; background: var(--blue); color: #fff; padding: 0 5px; }
/* 03: 3D 휠 */
#wheel { position: absolute; inset: 0 -14px 26px -8px; width: calc(100% + 22px); height: calc(100% - 26px); touch-action: pan-y; }
.slider { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; align-items: center; font: 600 10px/1 var(--sans); letter-spacing: .06em; color: var(--soft); }
.slider input { flex: 1; accent-color: var(--ink); min-width: 0; }
.fig { position: absolute; left: 0; top: 10px; font: 400 11px/1.5 var(--sans); color: var(--soft); }
/* 04: 세로 루트 */
.vroute { margin: 0; padding: 0; position: absolute; left: 6px; top: 18px; bottom: 12px; width: 2px; background: var(--ink); }
.vroute li { position: absolute; left: -5px; top: calc(var(--p) * 100%); list-style: none; display: flex; gap: 12px; align-items: center; white-space: nowrap; transform: translateY(-50%); }
.vroute li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ink); flex: none; }
.vroute li:first-child::before, .vroute li:last-child::before { background: var(--ink); }
.vroute b { font: 600 12px/1 var(--sans); } .vroute span { color: var(--soft); font-size: 11px; }
/* 05: 영수증 위젯 */
.mini { position: absolute; right: 0; top: 18px; width: min(100%, 180px); background: #fff; padding: 12px 12px 18px; font: 400 10.5px/1.6 ui-monospace, Menlo, monospace; transform: rotate(2deg); box-shadow: 0 1px 0 var(--rule); clip-path: polygon(0 0, 100% 0, 100% 100%, 92% 97%, 84% 100%, 76% 97%, 68% 100%, 60% 97%, 52% 100%, 44% 97%, 36% 100%, 28% 97%, 20% 100%, 12% 97%, 4% 100%, 0 97%); }
.mini p { margin: 0; display: flex; justify-content: space-between; }
.mini .h { justify-content: center; font-weight: 700; margin-bottom: 6px; }
.mini .t { border-top: 1px dashed var(--ink); margin-top: 6px; padding-top: 4px; font-weight: 700; }

.foot { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0 16px; border-top: 1.5px solid var(--rule); font-size: 11.5px; color: var(--soft); }
.foot a { color: var(--ink); text-decoration: none; margin-left: 16px; } .foot a:hover { color: var(--blue); }

/* 팝업 = 인덱스 시트 */
#wins { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
.lw { position: absolute; width: 380px; max-width: calc(100vw - 24px); background: #fff; pointer-events: auto; border-left: 1.5px solid var(--ink); box-shadow: 0 0 0 1px var(--rule), 0 20px 40px -24px rgba(0,0,0,.35); }
.lw-pop { animation: pop .22s ease-out both; } @keyframes pop { from { opacity: 0; transform: translateY(8px); } }
.lw-bar { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px 0; cursor: move; touch-action: none; }
.lw-t { font: 400 26px/1 var(--num-f); color: var(--num); }
.lw-x { border: 0; background: none; font: 400 13px/1 var(--sans); cursor: pointer; color: var(--soft); text-decoration: underline; text-underline-offset: 3px; }
.lw-x:hover, .lw-x:focus-visible { color: var(--blue); outline: none; }
.lw-body { padding: 10px 16px 18px; max-height: 70vh; overflow: auto; }
.pf-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pf-name { font: 400 28px/1 var(--sans); text-transform: uppercase; }
.pf-ko { color: var(--soft); }
.pf-plate { margin-left: auto; display: inline-flex; border: 1.5px solid var(--ink); font: 600 12px/1.6 var(--sans); gap: 5px; }
.pf-plate i, .pf-plate s { font-style: normal; text-decoration: none; background: var(--blue); color: #fff; padding: 0 4px; }
.pf-line { margin: 10px 0 12px; font: 600 14px/1.6 var(--ko); word-break: keep-all; }
.pf-dl { display: grid; grid-template-columns: 76px 1fr; margin: 0; border-top: 1px solid var(--rule); }
.pf-dl dt, .pf-dl dd { margin: 0; padding: 5px 0; border-bottom: 1px solid #e3e3df; }
.pf-dl dt { color: var(--soft); font-size: 11px; letter-spacing: .04em; } .pf-dl dd { word-break: keep-all; }
.pf-kw { margin: 10px 0 0; color: var(--blue); }
.rl, .nt { margin: 0; padding-left: 18px; } .rl li, .nt li { margin-bottom: 6px; word-break: keep-all; }
.lk { display: grid; } .lk a { color: var(--ink); text-decoration: none; display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 15px; } .lk a:hover { color: var(--blue); } .lk i { font-style: normal; }
.bk { display: grid; grid-template-columns: 76px 1fr; margin: 0; } .bk dt { color: var(--soft); font-size: 11px; padding: 4px 0; } .bk dd { margin: 0; padding: 3px 0; }
.rt { list-style: none; margin: 0 0 12px; padding: 0; } .rt li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.rc { font: 400 12px/1.6 ui-monospace, Menlo, monospace; } .rc-h { text-align: center; margin: 0; font-weight: 700; } .rc-m, .rc-t, .rc li { display: flex; justify-content: space-between; } .rc ul { list-style: none; margin: 8px 0; padding: 8px 0; border-block: 1px dashed var(--ink); } .rc-t { font-weight: 700; margin: 0; } .rc-f, .rc-m { color: var(--soft); margin: 6px 0 0; } .rc-f { text-align: center; }

@media (max-width: 980px) {
  html, body { height: auto; }
  .page { height: auto; }
  .cols { grid-template-columns: 1fr 1fr; gap: 34px 20px; }
  .col.c3 { grid-column: 1 / -1; } .c3 .mid { min-height: 300px; }
  .mid { min-height: 180px; }
}
@media (max-width: 560px) { .cols { grid-template-columns: 1fr; } .mast span:last-child { display: none; } }
@media (prefers-reduced-motion: reduce) { .lw-pop { animation: none; } }
</style>
</head>
<body>
<div class="page">
  <header class="mast"><b>YVAN &amp; LIA — INDEX</b><span>LOVE INFO / PARIS 75 / 2026</span><span id="today"></span></header>
  <main class="cols">
    <section class="col">
      <div class="n">01</div><h2>Rider</h2><p class="pg" id="pY"></p>
      <div class="mid"><div class="vert">YVAN<small>이반</small></div><span class="plate" id="plY"></span></div>
      <div class="items">
        <button type="button" data-open="p0"><b>Profile</b><span>나이, 키, 좋아하는 것 싫어하는 것.</span></button>
        <button type="button" data-open="machine"><b>Machine</b><span>정비는 직접 한다. 1974년식 카페 레이서.</span></button>
      </div>
    </section>
    <section class="col">
      <div class="n">02</div><h2>Passenger</h2><p class="pg" id="pL"></p>
      <div class="mid"><div class="vert">LIA<small>리아</small></div><span class="plate" id="plL"></span></div>
      <div class="items">
        <button type="button" data-open="p1"><b>Profile</b><span>뒷자리 고정. 출근 전 빵집 셔터를 올린다.</span></button>
        <button type="button" data-open="rel"><b>Us</b><span>첫 만남, 호칭, 싸우면 누가 먼저 연락하는지.</span></button>
      </div>
    </section>
    <section class="col c3">
      <div class="n">03</div><h2>Machine</h2><p class="pg" id="pM"></p>
      <div class="mid"><canvas id="wheel" aria-label="앞바퀴 분해도 3D"></canvas><span class="fig">FIG. 3 — FRONT WHEEL ASSY</span>
        <label class="slider" for="ex">ASSY <input type="range" id="ex" min="0" max="100" value="60"> EXPL.</label></div>
      <div class="items">
        <button type="button" data-open="machine"><b>Spec sheet</b><span>배기량, 연식, 번호판.</span></button>
      </div>
    </section>
    <section class="col">
      <div class="n">04</div><h2>Route</h2><p class="pg" id="pR"></p>
      <div class="mid"><ol class="vroute" id="vroute"></ol></div>
      <div class="items">
        <button type="button" data-open="route"><b>Paris — Deauville</b><span>토요일 새벽 6시 출발. 도착하면 바다 보고 크루아상.</span></button>
      </div>
    </section>
    <section class="col">
      <div class="n">05</div><h2>Boulangerie<br>&amp; Notice</h2><p class="pg" id="pD"></p>
      <div class="mid"><div class="mini" id="mini" role="button" tabindex="0" data-open="bread"></div></div>
      <div class="items">
        <button type="button" data-open="bread"><b>Reçu</b><span>리아네 가게 영수증.</span></button>
        <button type="button" data-open="notice"><b>Notice</b><span>연성 이용, 문의.</span></button>
        <button type="button" data-open="links"><b>Links</b><span>트위터, 티스토리, 인포.</span></button>
      </div>
    </section>
  </main>
  <footer class="foot"><span id="fs"></span><span id="fl"></span></footer>
</div>
<div id="wins"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="data.js"></script>
<script src="kit.js"></script>
<script>
(function () {
  var L = LUV, K = KIT, e = L.esc, Y = L.chars[0], Li = L.chars[1];
  var d = new Date(); document.getElementById('today').textContent = d.getDate() + '.' + (d.getMonth() + 1) + '.' + d.getFullYear();
  document.getElementById('pY').textContent = Y.birth + ' / ' + Y.height + 'CM';
  document.getElementById('pL').textContent = Li.birth + ' / ' + Li.height + 'CM';
  document.getElementById('pM').textContent = L.bike.cc + 'CC / ' + L.bike.year;
  document.getElementById('pR').textContent = L.route[L.route.length - 1][1] + ' KM';
  document.getElementById('pD').textContent = 'D+' + L.days();
  document.getElementById('plY').innerHTML = '<i>F</i>' + Y.plate + '<s>' + Y.dept + '</s>';
  document.getElementById('plL').innerHTML = '<i>F</i>' + Li.plate + '<s>' + Li.dept + '</s>';
  var max = L.route[L.route.length - 1][1];
  document.getElementById('vroute').innerHTML = L.route.map(function (r) { return '<li style="--p:' + (r[1] / max) + '"><b>' + r[0] + '</b><span>' + r[1] + '</span></li>'; }).join('');
  document.getElementById('mini').innerHTML = '<p class="h">BOULANGERIE Y·L</p>' + L.bakery.slice(0, 3).map(function (m) { return '<p><span>' + e(m[0]) + '</span><span>' + m[1] + '</span></p>'; }).join('') + '<p class="t"><span>TOTAL</span><span>D+' + L.days() + '</span></p>';
  document.getElementById('fs').textContent = L.pair + ' · since ' + K.since('.');
  document.getElementById('fl').innerHTML = L.links.map(function (l) { return '<a href="' + e(l[1]) + '" target="_blank" rel="noopener">' + e(l[0]) + ' ↗</a>'; }).join('');
  var W = {
    p0: function () { K.open('p0', '01', K.profile(0)); },
    p1: function () { K.open('p1', '02', K.profile(1)); },
    machine: function () { K.open('machine', '03', '<p style="margin:0 0 8px;font-weight:600">이반의 바이크</p>' + K.bike(), { w: 320 }); },
    route: function () { K.open('route', '04', K.route(), { w: 320 }); },
    rel: function () { K.open('rel', '02 · US', K.relation()); },
    bread: function () { K.open('bread', '05', K.receipt(), { w: 300 }); },
    notice: function () { K.open('notice', '05 · NOTICE', K.notice(), { w: 340 }); },
    links: function () { K.open('links', '05 · LINKS', K.links(), { w: 300 }); }
  };
  K.bind(W);
  K.demo([['p1', 290, 150], ['route', 640, 430], ['bread', 960, 170]]);
  document.getElementById('mini').addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); W.bread(); } });

  var cv = document.getElementById('wheel');
  var S = K.stage(cv, { fov: 26, z: 13, fit: function (c, w, h) { c.position.z = Math.max(9, 4.9 / (.4618 * w / h)); } });
  if (!S) return;
  var T = S.T, rig = new T.Group(); S.scene.add(rig); rig.rotation.set(.35, -.95, 0);
  var edgeM = new T.LineBasicMaterial({ color: 0x161616 });
  function part(geo, color) {
    var g = new T.Group();
    g.add(new T.Mesh(geo, new T.MeshBasicMaterial({ color: color, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })));
    g.add(new T.LineSegments(new T.EdgesGeometry(geo, 25), edgeM)); return g;
  }
  var H = Math.PI / 2;
  // 디스크: 구멍 뚫린 링을 Shape 로
  var ds = new T.Shape(); ds.absarc(0, 0, 1.15, 0, Math.PI * 2, false);
  var hole0 = new T.Path(); hole0.absarc(0, 0, .55, 0, Math.PI * 2, true); ds.holes.push(hole0);
  for (var i = 0; i < 12; i++) { var a = i / 12 * Math.PI * 2, hp = new T.Path(); hp.absarc(Math.cos(a) * .86, Math.sin(a) * .86, .07, 0, Math.PI * 2, true); ds.holes.push(hp); }
  var disc = new T.ExtrudeGeometry(ds, { depth: .05, bevelEnabled: false, curveSegments: 24 }); disc.center();
  var parts = [
    part(new T.CylinderGeometry(.06, .06, 4.2, 12).rotateX(H), 0xffffff),   // axle
    part(disc, 0xf4f4f2),                                                   // brake disc
    part(new T.CylinderGeometry(.42, .42, .5, 32).rotateX(H), 0xffffff),    // hub
    part(new T.TorusGeometry(1.62, .07, 10, 80), 0x2546a8),                // rim
    part(new T.TorusGeometry(1.86, .26, 14, 80), 0x161616)                 // tire
  ];
  // spokes on the hub group
  var sp = []; for (var k = 0; k < 24; k++) { var b = k / 24 * Math.PI * 2, z = k % 2 ? .2 : -.2; sp.push(new T.Vector3(Math.cos(b) * .42, Math.sin(b) * .42, z), new T.Vector3(Math.cos(b + .3) * 1.58, Math.sin(b + .3) * 1.58, 0)); }
  parts[2].add(new T.LineSegments(new T.BufferGeometry().setFromPoints(sp), new T.LineBasicMaterial({ color: 0x8a8a86 })));
  var zE = [0, 1.7, .5, -.9, -2.1];
  parts.forEach(function (p) { rig.add(p); });
  parts[1].position.z = .3;
  var ex = document.getElementById('ex'), target = .6, cur = 0;
  ex.oninput = function () { target = ex.value / 100; };
  S.loop(function (t) {
    cur += (target - cur) * .08;
    parts.forEach(function (p, i) { var base = i === 1 ? .3 : 0; p.position.z = base + (zE[i] - base) * cur; });
    rig.rotation.y = -.95 + Math.sin(t * .4) * .25;
  });
})();
</script>
</body>
</html>
