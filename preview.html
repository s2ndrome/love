<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine Archive</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Gowun+Dodum&display=swap');

* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; }

body {
  overflow-x: hidden;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.95) 0 2px, transparent 3px),
    radial-gradient(circle at 82% 75%, rgba(255,255,255,.8) 0 2px, transparent 3px),
    linear-gradient(135deg, #fffaf8, #f9eef1 48%, #fdf8f2);
  background-size: 130px 130px, 170px 170px, auto;
  color: #80686d;
  font-family: "Gowun Dodum", sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 14px;
  pointer-events: none;
  border: 1px solid rgba(193, 142, 157, .32);
  border-radius: 8px;
  z-index: 5;
}

button { font: inherit; }

.home {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 70px 24px;
}

.main-image-button {
  position: relative;
  width: min(590px, 78vw);
  padding: 13px;
  border: 0;
  border-radius: 3px;
  background: #fff;
  box-shadow: 0 18px 55px rgba(126, 83, 96, .16);
  cursor: pointer;
  transform: rotate(-1deg);
  transition: transform .4s ease, box-shadow .4s ease;
}

.main-image-button::before,
.main-image-button::after {
  content: "✿";
  position: absolute;
  z-index: 2;
  color: #d89aaa;
  font-size: 25px;
}
.main-image-button::before { left: -12px; top: -15px; }
.main-image-button::after { right: -12px; bottom: -15px; }

.main-image-button img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 72vh;
  object-fit: cover;
  border: 1px solid rgba(167, 125, 137, .22);
}

.main-image-button:hover {
  transform: rotate(0deg) scale(1.025);
  box-shadow: 0 24px 70px rgba(126, 83, 96, .23);
}

.click-hint {
  position: absolute;
  right: 22px;
  bottom: 20px;
  padding: 6px 11px;
  border-radius: 999px;
  background: rgba(255, 248, 249, .9);
  color: #c68194;
  font-size: 12px;
  letter-spacing: .06em;
}

.site-mark {
  position: absolute;
  bottom: 24px;
  margin: 0;
  color: #ad8792;
  font-family: "DM Serif Display", serif;
  font-size: 15px;
  letter-spacing: .2em;
}

.deco {
  position: absolute;
  color: rgba(198, 132, 151, .65);
  font-size: 30px;
  animation: float 4s ease-in-out infinite;
}
.deco-left { left: 12%; top: 24%; }
.deco-right { right: 13%; bottom: 27%; animation-delay: 1s; }

@keyframes float {
  0%,100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-9px) rotate(8deg); }
}

/* modal base */
.modal-layer {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(91, 61, 70, .28);
  backdrop-filter: blur(9px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .3s ease, visibility .3s ease;
}

.modal-layer.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.modal-window {
  position: relative;
  background:
    radial-gradient(circle at 50% 10%, rgba(255,255,255,.95), transparent 40%),
    #fff8f6;
  border: 1px solid #dfb8c1;
  box-shadow:
    0 30px 90px rgba(65, 38, 47, .24),
    inset 0 0 0 7px rgba(255,255,255,.7);
  transform: translateY(22px) scale(.94);
  transition: transform .38s cubic-bezier(.2,.8,.2,1);
}

.modal-layer.active .modal-window { transform: translateY(0) scale(1); }

.menu-window {
  width: min(440px, 92vw);
  max-height: min(86vh, 780px);
  overflow-y: auto;
  padding: 62px 48px 45px;
}

/* ---- profile card ---- */
.profile-mini {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.profile-mini .avatar {
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid #e6c4ca;
  background: linear-gradient(145deg, #f8dfe5, #fff);
}

.profile-mini .avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.profile-mini .handle {
  font-size: 12px;
  letter-spacing: .05em;
  color: #9c7180;
}

.profile-mini .handle small {
  display: block;
  margin-top: 3px;
  color: #c68194;
  font-size: 9px;
  letter-spacing: .16em;
}

/* ---- quick icon nav ---- */
.icon-nav {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
}

.icon-nav button {
  flex: 1;
  display: grid;
  place-items: center;
  height: 38px;
  border: 1px solid #e6c4ca;
  border-radius: 8px;
  background: rgba(255, 255, 255, .6);
  color: #b47d8b;
  font-size: 15px;
  cursor: pointer;
  transition: background .2s ease, color .2s ease, transform .2s ease;
}

.icon-nav button:hover {
  background: #f5dae0;
  color: #ce788f;
  transform: translateY(-1px);
}

/* ---- info / links card ---- */
.info-card,
.links-card {
  margin-top: 20px;
  padding: 14px 16px;
  border: 1px dashed #ddb3bd;
  background: rgba(255, 255, 255, .55);
}

.info-card .card-label,
.links-card .card-label {
  margin: 0 0 9px;
  font-size: 10px;
  letter-spacing: .16em;
  color: #c0919c;
}

.info-card .info-row {
  display: flex;
  justify-content: space-between;
  padding: 5px 0;
  font-size: 11px;
  color: #80686d;
  border-bottom: 1px dashed rgba(196, 145, 157, .35);
}

.info-card .info-row:last-child { border-bottom: 0; }

.links-card .link-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 11px;
  border: 1px solid #e6c4ca;
  border-radius: 6px;
  background: #fff;
  color: #8a6a73;
  font-size: 11px;
  text-decoration: none;
}

.links-card .link-item:hover { background: #fdf2f4; }
.links-card .link-item .lock { opacity: .55; font-size: 10px; }

/* ---- banner ---- */
.banner-strip {
  margin-top: 18px;
  height: 62px;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #e6c4ca;
  background: linear-gradient(120deg, #f7d8de, #fbeef1 45%, #f3d3db);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #c78a99;
  font-size: 10px;
  letter-spacing: .1em;
}

/* ---- feed cards (content pages) ---- */
.feed-card {
  border: 1px solid #e6c4ca;
  background: rgba(255, 255, 255, .6);
  border-radius: 4px;
  padding: 18px 20px;
  margin-bottom: 16px;
}

.card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px dashed rgba(196, 145, 157, .4);
}

.card-header .card-icon {
  color: #d998a8;
  font-size: 13px;
}

.card-header .card-title {
  font-size: 12px;
  letter-spacing: .14em;
  color: #9c7180;
}

.feed-card p:last-child { margin-bottom: 0; }

/* ---- playlist card ---- */
.playlist-card .track-thumb {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 4px;
  margin-bottom: 12px;
  border: 1px solid #e6c4ca;
  background: linear-gradient(135deg, #f3d0d8, #fff);
  display: grid;
  place-items: center;
  color: #c78a99;
  font-size: 24px;
}

.playlist-card .track-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.playlist-card .track-list li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 4px;
  font-size: 12px;
  color: #80686d;
  border-bottom: 1px dashed rgba(196, 145, 157, .3);
}

.playlist-card .track-list li:last-child { border-bottom: 0; }

.playlist-card .track-num {
  width: 18px;
  color: #d998a8;
  font-size: 11px;
}

.content-window {
  width: min(850px, 92vw);
  max-height: min(82vh, 820px);
  padding: 50px 55px 55px;
  overflow: auto;
}

.close-button {
  position: absolute;
  top: 14px;
  right: 18px;
  z-index: 3;
  width: 30px;
  height: 30px;
  border: 0;
  background: transparent;
  color: #a97986;
  font-size: 27px;
  line-height: 1;
  cursor: pointer;
  transition: transform .25s ease, color .2s ease;
}
.close-button:hover { color: #d17e95; transform: rotate(90deg); }

.back-button {
  position: absolute;
  top: 18px;
  left: 22px;
  border: 0;
  background: transparent;
  color: #b27d8b;
  font-size: 11px;
  letter-spacing: .08em;
  cursor: pointer;
}
.back-button:hover { color: #d17d94; }

.lace-line {
  text-align: center;
  color: #d99baa;
  font-size: 13px;
  letter-spacing: 5px;
}

.ribbon {
  width: fit-content;
  min-width: 120px;
  margin: 12px auto 8px;
  padding: 10px 25px;
  background: #e6a6b4;
  color: white;
  text-align: center;
  font-family: "DM Serif Display", serif;
  font-size: 20px;
  letter-spacing: .14em;
  box-shadow: 0 7px 18px rgba(191, 113, 133, .18);
}

.modal-subtitle {
  margin: 0 0 28px;
  text-align: center;
  color: #ad858e;
  font-size: 11px;
}

.menu-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.menu-list button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 12px 15px;
  border: 0;
  border-bottom: 1px dashed rgba(196,145,157,.48);
  background: transparent;
  color: #80666e;
  text-align: left;
  font-size: 14px;
  letter-spacing: .12em;
  cursor: pointer;
  transition: padding .22s ease, color .22s ease, background .22s ease;
}
.menu-list button span { color: #d998a8; opacity: .75; }
.menu-list button:hover {
  padding-left: 22px;
  color: #ce788f;
  background: rgba(245,218,224,.35);
}

.modal-footer {
  margin-top: 25px;
  text-align: center;
  color: #c2959e;
  font-size: 10px;
}

.content-header {
  text-align: center;
  padding-bottom: 25px;
  border-bottom: 1px dashed rgba(196,145,157,.48);
}

.tiny-label {
  margin: 0 0 5px;
  color: #c0919c;
  font-size: 9px;
  letter-spacing: .2em;
}

.content-header h1 {
  margin: 0 0 10px;
  color: #9b6f7a;
  font-family: "DM Serif Display", serif;
  font-size: 34px;
  font-weight: 400;
  letter-spacing: .12em;
}

.content-body { padding-top: 28px; }

.intro-card {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 28px;
  align-items: center;
}

.fake-photo,
.character-card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  background: linear-gradient(145deg, #f8dfe5, #fff);
  border: 1px solid #e4c0c8;
}

.content-body h2 {
  margin: 0 0 12px;
  color: #a06f7c;
  font-family: "DM Serif Display", serif;
  font-weight: 400;
  letter-spacing: .08em;
}

.content-body p {
  margin: 0 0 12px;
  color: #806b70;
  font-size: 13px;
  line-height: 2;
}

.info-list {
  margin: 20px 0 0;
  padding: 15px 18px;
  border: 1px dashed #ddb3bd;
  background: rgba(255,255,255,.55);
  font-size: 12px;
  line-height: 2;
}

.character-grid,
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.character-card,
.gallery-item {
  padding: 10px;
  border: 1px solid #e6c4ca;
  background: rgba(255,255,255,.55);
}

.character-card h3 {
  margin: 10px 0 3px;
  color: #9c7180;
  font-size: 13px;
}
.character-card p {
  margin: 0;
  font-size: 10px;
  line-height: 1.6;
}

.gallery-item {
  aspect-ratio: 1 / 1;
  display: grid;
  place-items: center;
  color: #c28d9b;
  font-size: 12px;
}

.diary-entry,
.world-entry,
.guestbook-entry {
  padding: 17px 18px;
  margin-bottom: 12px;
  border: 1px dashed #ddb3bd;
  background: rgba(255,255,255,.55);
}

.entry-date {
  margin-bottom: 6px !important;
  color: #c18b98 !important;
  font-size: 10px !important;
}

.guestbook-entry strong {
  color: #a06f7c;
  font-size: 12px;
}

/* mobile */
@media (max-width: 600px) {
  body::before { inset: 8px; }

  .home { padding: 35px 18px 70px; }

  .main-image-button { width: 90vw; padding: 9px; }

  .click-hint {
    right: 14px;
    bottom: 14px;
    font-size: 10px;
  }

  .deco { font-size: 21px; }
  .deco-left { left: 7%; top: 17%; }
  .deco-right { right: 8%; bottom: 19%; }

  .site-mark { bottom: 24px; font-size: 12px; }

  .modal-layer { padding: 12px; }

  .menu-window {
    width: 100%;
    padding: 58px 28px 48px;
  }

  .content-window {
    width: 100%;
    max-height: 88vh;
    padding: 52px 22px 35px;
  }

  .content-header h1 { font-size: 28px; }

  .intro-card {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .fake-photo {
    width: min(190px, 60vw);
    margin: 0 auto;
  }

  .character-grid,
  .gallery-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .menu-list button {
    padding: 13px 10px;
    font-size: 13px;
  }

  .profile-mini .avatar { width: 40px; height: 40px; }
  .icon-nav button { height: 36px; font-size: 14px; }
  .feed-card { padding: 15px 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
  <main class="home">
    <div class="deco deco-left">✦</div>
    <div class="deco deco-right">♡</div>

    <button class="main-image-button" id="openMenu" aria-label="메뉴 열기">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='100%25' height='100%25' fill='%23f6dbe1'/><text x='50%25' y='50%25' font-size='20' fill='%23c78a99' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif'>main.jpg</text></svg>" alt="Main Image">
      <span class="click-hint">click me ♡</span>
    </button>

    <p class="site-mark">MARINE ARCHIVE</p>
  </main>

  <!-- MENU -->
  <div class="modal-layer" id="menuLayer" aria-hidden="true">
    <div class="menu-window modal-window">
      <button class="close-button" data-close="menuLayer" aria-label="메뉴 닫기">×</button>

      <div class="profile-mini">
        <div class="avatar"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='100%25' height='100%25' fill='%23f6dbe1'/><text x='50%25' y='50%25' font-size='20' fill='%23c78a99' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif'>main.jpg</text></svg>" alt="profile"></div>

      <nav class="menu-list">
        <button data-page="about">ABOUT <span>♡</span></button>
        <button data-page="characters">CHARACTERS <span>✦</span></button>
        <button data-page="gallery">GALLERY <span>♡</span></button>
        <button data-page="diary">DIARY <span>✧</span></button>
        <button data-page="world">WORLD <span>♡</span></button>
        <button data-page="guestbook">GUESTBOOK <span>✦</span></button>
      </nav>

      <div class="info-card">
        <p class="card-label">TODAY'S MOOD</p>
        <div class="info-row"><span>NAME</span><span>YOUR NAME</span></div>
        <div class="info-row"><span>SINCE</span><span>2026</span></div>
        <div class="info-row"><span>MOOD</span><span>♡ dreamy</span></div>
      </div>

      <div class="links-card">
        <p class="card-label">LINKS</p>
        <a class="link-item" href="#"><span class="lock">🔒</span> my other archive</a>
      </div>

      <div class="banner-strip">banner ♡ swap image here</div>

      <div class="modal-footer">choose a little door ♡</div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="modal-layer" id="contentLayer" aria-hidden="true">
    <article class="content-window modal-window">
      <button class="close-button" data-close="contentLayer" aria-label="본문 닫기">×</button>
      <button class="back-button" id="backToMenu">← MENU</button>

      <header class="content-header">
        <p class="tiny-label">MARINE ARCHIVE</p>
        <h1 id="contentTitle">ABOUT</h1>
        <div class="lace-line">♡ ─── ✦ ─── ♡</div>
      </header>

      <div id="contentBody" class="content-body"></div>
    </article>
  </div>

  <script>const menuLayer = document.getElementById("menuLayer");
const contentLayer = document.getElementById("contentLayer");
const openMenu = document.getElementById("openMenu");
const contentTitle = document.getElementById("contentTitle");
const contentBody = document.getElementById("contentBody");
const backToMenu = document.getElementById("backToMenu");

const pages = {
  about: {

        <div class="track-thumb">▶</div>
        <ul class="track-list">
          <li><span class="track-num">01</span>song title one</li>
          <li><span class="track-num">02</span>song title two</li>
          <li><span class="track-num">03</span>song title three</li>
        </ul>
      </div>
    `
  },

  characters: {
    title: "CHARACTERS",
    html: `
      <div class="feed-card">
        <div class="card-header"><span class="card-icon">✦</span><span class="card-title">CAST</span></div>
        <div class="character-grid">
          <article class="character-card">
            <div class="fake-photo">CHARACTER<br>01</div>
            <h3>Character One</h3>

          </article>
          <article class="character-card">

            <h3>Character Three</h3>
            <p>나중에 노션 데이터로 교체할 예정.</p>
          </article>
        </div>
      </div>
    `
  },

  gallery: {
    title: "GALLERY",
    html: `
      <div class="feed-card">
        <div class="card-header"><span class="card-icon">♡</span><span class="card-title">SNAPSHOTS</span></div>
        <div class="gallery-grid">
          <div class="gallery-item">IMAGE 01</div>
          <div class="gallery-item">IMAGE 02</div>
          <div class="gallery-item">IMAGE 03</div>
          <div class="gallery-item">IMAGE 04</div>
          <div class="gallery-item">IMAGE 05</div>
          <div class="gallery-item">IMAGE 06</div>
        </div>
        <p style="margin-top:18px;text-align:center;font-size:10px;">이미지만 추가하면 갤러리로 바로 사용할 수 있어요 ♡</p>
      </div>
    `

function openLayer(layer) {
  layer.classList.add("active");
  layer.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeLayer(layer) {
  layer.classList.remove("active");
  layer.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

openMenu.addEventListener("click", () => openLayer(menuLayer));

document.querySelectorAll("[data-page]").forEach(button => {
  button.addEventListener("click", () => {
    const page = pages[button.dataset.page];
    if (!page) return;

    contentTitle.textContent = page.title;
    contentBody.innerHTML = page.html;

    closeLayer(menuLayer);
    openLayer(contentLayer);
  });
});

backToMenu.addEventListener("click", () => {
  closeLayer(contentLayer);
  openLayer(menuLayer);
});

document.querySelectorAll("[data-close]").forEach(button => {
  button.addEventListener("click", () => {
    closeLayer(document.getElementById(button.dataset.close));
  });
});

[menuLayer, contentLayer].forEach(layer => {
  layer.addEventListener("click", event => {
    if (event.target === layer) closeLayer(layer);
  });
});

document.addEventListener("keydown", event => {
  if (event.key !== "Escape") return;

  if (contentLayer.classList.contains("active")) {
    closeLayer(contentLayer);
    openLayer(menuLayer);
  } else if (menuLayer.classList.contains("active")) {
    closeLayer(menuLayer);
    openMenu.focus();
  }
});
</script>
