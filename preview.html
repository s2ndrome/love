<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine Archive</title>
  <style>:root {
  --bg1: #bcd9ff;
  --bg2: #d9c6ff;
  --bg3: #ffd7e6;
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --window-bg: rgba(255, 255, 255, .78);
  --window-border: rgba(255, 255, 255, .6);
  --accent: #0a84ff;
  --sep: rgba(0, 0, 0, .08);
  --radius-window: 14px;
  --radius-card: 12px;
}

* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; }

body {
  overflow-x: hidden;
  min-height: 100vh;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 18% 18%, var(--bg1), transparent 45%),
    radial-gradient(circle at 85% 15%, var(--bg2), transparent 45%),
    radial-gradient(circle at 50% 92%, var(--bg3), transparent 55%),
    linear-gradient(160deg, #eaf3ff, #f5eeff 55%, #fff0f5);
  background-attachment: fixed;
}

button { font: inherit; }

/* ---------------------------------- */
/* menu bar */
/* ---------------------------------- */
.menubar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 40;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: rgba(255, 255, 255, .55);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(0, 0, 0, .06);
  font-size: 12.5px;
  color: #333;
}

.menubar-brand {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}

.menubar-right {
  display: flex;
  align-items: center;
  gap: 14px;
  color: #555;
  font-variant-numeric: tabular-nums;
}

/* ---------------------------------- */
/* home / desktop */
/* ---------------------------------- */
.home {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 90px 24px 140px;
}

.main-image-button {
  position: relative;
  width: min(420px, 80vw);
  padding: 0;
  border: 0;
  border-radius: 16px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 25px 70px rgba(31, 26, 50, .26);
  cursor: pointer;
  transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s ease;
}

.main-image-button img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 56vh;
  object-fit: cover;
}

.main-image-button:hover {
  transform: translateY(-6px);
  box-shadow: 0 35px 90px rgba(31, 26, 50, .32);
}

.click-hint {
  position: absolute;
  right: 14px;
  bottom: 14px;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .85);
  backdrop-filter: blur(6px);
  color: #333;
  font-size: 11.5px;
  font-weight: 500;
}

.site-mark {
  margin: 0;
  color: rgba(60, 60, 67, .8);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* ---------------------------------- */
/* dock */
/* ---------------------------------- */
.dock {
  position: fixed;
  left: 50%;
  bottom: 18px;
  z-index: 35;
  transform: translateX(-50%);
  display: flex;
  align-items: flex-end;
  gap: 12px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, .55);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, .6);
  border-radius: 20px;
  box-shadow: 0 12px 40px rgba(31, 26, 50, .18);
}

.dock button {
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-size: 21px;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .12);
  transition: transform .18s cubic-bezier(.2, .8, .2, 1);
}

.dock button:hover { transform: translateY(-10px) scale(1.12); }
.dock button:active { transform: translateY(-4px) scale(1.04); }

.dock-about       { background: linear-gradient(160deg, #6db8ff, #2f80ed); }
.dock-characters  { background: linear-gradient(160deg, #c39bff, #8a5cf6); }
.dock-gallery     { background: linear-gradient(160deg, #ff9ec4, #ec5e93); }
.dock-diary       { background: linear-gradient(160deg, #ffc36b, #f2994a); }
.dock-world       { background: linear-gradient(160deg, #7be0b8, #2fbf71); }
.dock-guestbook   { background: linear-gradient(160deg, #7fe0e0, #2fb6b6); }

/* ---------------------------------- */
/* modal base */
/* ---------------------------------- */
.modal-layer {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(20, 20, 30, .22);
  backdrop-filter: blur(6px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .25s ease, visibility .25s ease;
}

.modal-layer.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.modal-window {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--window-bg);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--window-border);
  border-radius: var(--radius-window);
  box-shadow: 0 30px 80px rgba(20, 15, 35, .35), inset 0 2px 0 rgba(255, 255, 255, .6);
  overflow: hidden;
  transform: translateY(16px) scale(.96);
  transition: transform .32s cubic-bezier(.2, .8, .2, 1);
}

.modal-layer.active .modal-window { transform: translateY(0) scale(1); }

/* ---- titlebar (traffic lights) ---- */
.titlebar {
  position: relative;
  flex: 0 0 auto;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--sep);
}

.traffic {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  gap: 8px;
}

.traffic span,
.traffic button {
  width: 12px;
  height: 12px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  display: block;
}

.traffic .t-red { background: #ff5f57; cursor: pointer; }
.traffic .t-yellow { background: #ffbd2e; }
.traffic .t-green { background: #28c840; }

.titlebar-title {
  font-size: 13px;
  font-weight: 600;
  color: #333;
  letter-spacing: .01em;
}

.back-button {
  position: absolute;
  left: 62px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 7px;
  background: rgba(0, 0, 0, .05);
  color: #555;
  font-size: 15px;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background .15s ease;
}

.back-button:hover { background: rgba(0, 0, 0, .1); }

/* ---------------------------------- */
/* menu window (sidebar list) */
/* ---------------------------------- */
.menu-window {
  width: min(360px, 92vw);
  max-height: min(80vh, 620px);
}

.menu-body {
  padding: 14px 14px 18px;
  overflow-y: auto;
}

.profile-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 14px;
}

.profile-row .avatar {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  border-radius: 9px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
}

.profile-row .avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.profile-row .who {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.profile-row .who small {
  display: block;
  margin-top: 1px;
  color: #8a8a8e;
  font-size: 11px;
  font-weight: 400;
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-list button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  font-size: 13.5px;
  text-align: left;
  cursor: pointer;
  transition: background .15s ease;
}

.nav-list button:hover { background: rgba(0, 0, 0, .045); }
.nav-list button:active { background: rgba(10, 132, 255, .14); }

.nav-icon {
  width: 26px;
  height: 26px;
  flex: 0 0 auto;
  border-radius: 7px;
  display: grid;
  place-items: center;
  font-size: 13px;
  color: #fff;
}

.nav-icon.c-blue   { background: linear-gradient(160deg, #6db8ff, #2f80ed); }
.nav-icon.c-purple { background: linear-gradient(160deg, #c39bff, #8a5cf6); }
.nav-icon.c-pink   { background: linear-gradient(160deg, #ff9ec4, #ec5e93); }
.nav-icon.c-orange { background: linear-gradient(160deg, #ffc36b, #f2994a); }
.nav-icon.c-green  { background: linear-gradient(160deg, #7be0b8, #2fbf71); }
.nav-icon.c-teal   { background: linear-gradient(160deg, #7fe0e0, #2fb6b6); }

.nav-chevron {
  margin-left: auto;
  color: #c7c7cc;
  font-size: 12px;
}

/* ---------------------------------- */
/* content window */
/* ---------------------------------- */
.content-window {
  width: min(720px, 92vw);
  max-height: min(84vh, 760px);
}

.content-body-wrap {
  padding: 26px 30px 34px;
  overflow-y: auto;
}

/* feed cards -> grouped mac list style */
.feed-card {
  background: rgba(255, 255, 255, .6);
  border: 1px solid rgba(0, 0, 0, .06);
  border-radius: var(--radius-card);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .03);
  padding: 16px 18px;
  margin-bottom: 14px;
}

.card-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}

.card-header .card-icon {
  color: var(--accent);
  font-size: 11px;
}

.card-header .card-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  color: #8a8a8e;
  text-transform: uppercase;
}

.feed-card p:last-child { margin-bottom: 0; }

.intro-card {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 18px;
  align-items: center;
}

.fake-photo,
.character-card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid rgba(0, 0, 0, .06);
  background: linear-gradient(160deg, #eef3fb, #fff);
}

.content-body h2 {
  margin: 0 0 8px;
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
}

.content-body p {
  margin: 0 0 10px;
  color: #3c3c43;
  font-size: 13px;
  line-height: 1.75;
}

.info-list {
  margin: 20px 0 0;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid rgba(0, 0, 0, .06);
  background: rgba(255, 255, 255, .6);
  font-size: 12px;
  line-height: 1.9;
}

.character-grid,
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.character-card,
.gallery-item {
  padding: 8px;
  border-radius: 10px;
  border: 1px solid rgba(0, 0, 0, .06);
  background: rgba(255, 255, 255, .6);
}

.character-card h3 {
  margin: 10px 0 3px;
  color: var(--text);
  font-size: 13px;
}

.character-card p {
  margin: 0;
  font-size: 10px;
  line-height: 1.6;
}

.gallery-item {
  aspect-ratio: 1 / 1;
  display: grid;
  place-items: center;
  color: #9a9aa0;
  font-size: 12px;
}

/* playlist card */
.playlist-card .track-thumb {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 10px;
  margin-bottom: 12px;
  border: 1px solid rgba(0, 0, 0, .06);
  background: linear-gradient(160deg, #eef3fb, #fff);
  display: grid;
  place-items: center;
  color: #9a9aa0;
  font-size: 22px;
}

.playlist-card .track-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.playlist-card .track-list li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 4px;
  font-size: 12.5px;
  color: #3c3c43;
  border-bottom: 1px solid rgba(0, 0, 0, .05);
}

.playlist-card .track-list li:last-child { border-bottom: 0; }

.playlist-card .track-num {
  width: 18px;
  color: #a0a0a5;
  font-size: 11px;
}

/* diary list + note detail */
.diary-list {
  display: flex;
  flex-direction: column;
  border-top: 1px solid rgba(10, 132, 255, .18);
}

.diary-list button {
  width: 100%;
  padding: 20px 6px;
  border: 0;
  border-bottom: 1px solid rgba(10, 132, 255, .18);
  background: transparent;
  color: #8a8a8e;
  font-size: 14.5px;
  text-align: left;
  cursor: pointer;
  transition: color .15s ease, background .15s ease;
}

.diary-list button:hover {
  color: #3c3c43;
  background: rgba(10, 132, 255, .05);
}

.diary-note {
  border: 1px solid rgba(0, 0, 0, .1);
  border-radius: 14px;
  padding: 22px 24px 18px;
  background: rgba(255, 255, 255, .55);
}

.diary-note-date {
  display: inline-block;
  margin-bottom: 18px;
  padding: 2px 10px;
  border: 1px dashed rgba(10, 132, 255, .4);
  border-radius: 6px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
}

.diary-note-body p {
  margin: 0 0 16px;
  color: #3c3c43;
  font-size: 13.5px;
  line-height: 1.9;
  white-space: pre-line;
}

.diary-note-body p:last-child { margin-bottom: 0; }

.diary-note-gap { margin-top: 26px !important; }

.diary-dots {
  text-align: center;
  color: #c7c7cc;
  letter-spacing: 6px;
  margin: 22px 0;
  font-size: 13px;
}

.diary-note-compose {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 22px;
  padding-top: 14px;
  border-top: 1px solid rgba(0, 0, 0, .08);
  color: #c7c7cc;
}

.diary-note-cursor { font-size: 13px; }

.diary-note-icon {
  width: 18px;
  height: 18px;
  opacity: .5;
}

.diary-note-icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.diary-entry,
.world-entry,
.guestbook-entry {
  padding: 14px 16px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid rgba(0, 0, 0, .06);
  background: rgba(255, 255, 255, .6);
}

.entry-date {
  margin-bottom: 6px !important;
  color: #9a9aa0 !important;
  font-size: 10.5px !important;
  text-transform: uppercase;
  letter-spacing: .06em;
}

.guestbook-entry strong {
  color: var(--text);
  font-size: 12.5px;
}

/* ---------------------------------- */
/* mobile */
/* ---------------------------------- */
@media (max-width: 600px) {
  .home { padding: 60px 18px 130px; }

  .main-image-button { width: 88vw; }

  .site-mark { font-size: 12px; }

  .menubar { padding: 0 12px; font-size: 11.5px; }

  .dock { gap: 8px; padding: 8px 10px; border-radius: 18px; }
  .dock button { width: 40px; height: 40px; font-size: 18px; border-radius: 11px; }
  .dock button:hover { transform: translateY(-6px) scale(1.08); }

  .modal-layer { padding: 12px; }

  .menu-window { width: 100%; }
  .content-window { width: 100%; max-height: 88vh; }

  .content-body-wrap { padding: 20px 18px 28px; }

  .intro-card { grid-template-columns: 1fr; gap: 14px; }
  .fake-photo { width: min(160px, 55vw); margin: 0 auto; }

  .character-grid,
  .gallery-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
  <header class="menubar">
    <span class="menubar-brand">🌊 Marine Archive</span>
    <span class="menubar-right"><span id="menubarClock">--:--</span></span>
  </header>

  <main class="home">
    <button class="main-image-button" id="openMenu" aria-label="메뉴 열기">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='100%25' height='100%25' fill='%23eaf3ff'/><text x='50%25' y='50%25' font-size='20' fill='%232f80ed' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif'>main.jpg</text></svg>" alt="Main Image">
      <span class="click-hint">열어보기</span>
    </button>

    <p class="site-mark">Marine Archive</p>
  </main>

  <nav class="dock" aria-label="빠른 이동">
    <button class="dock-about" data-page="about" title="About" aria-label="About">👤</button>
    <button class="dock-characters" data-page="characters" title="Characters" aria-label="Characters">🎭</button>
    <button class="dock-gallery" data-page="gallery" title="Gallery" aria-label="Gallery">🖼️</button>
    <button class="dock-diary" data-page="diary" title="Diary" aria-label="Diary">📔</button>
    <button class="dock-world" data-page="world" title="World" aria-label="World">🌐</button>
    <button class="dock-guestbook" data-page="guestbook" title="Guestbook" aria-label="Guestbook">✍️</button>
  </nav>

  <!-- MENU -->
  <div class="modal-layer" id="menuLayer" aria-hidden="true">
    <div class="menu-window modal-window">
      <div class="titlebar">
        <div class="traffic">
          <button class="t-red" data-close="menuLayer" aria-label="메뉴 닫기"></button>
          <span class="t-yellow" aria-hidden="true"></span>
          <span class="t-green" aria-hidden="true"></span>
        </div>
        <span class="titlebar-title">Marine Archive</span>
      </div>

      <div class="menu-body">
        <div class="profile-row">
          <div class="avatar"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='100%25' height='100%25' fill='%23eaf3ff'/><text x='50%25' y='50%25' font-size='20' fill='%232f80ed' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif'>main.jpg</text></svg>" alt="profile"></div>
          <div class="who">@yourhandle<small>Marine Archive</small></div>
        </div>

        <nav class="nav-list">
          <button data-page="about"><span class="nav-icon c-blue">👤</span>About<span class="nav-chevron">›</span></button>
          <button data-page="characters"><span class="nav-icon c-purple">🎭</span>Characters<span class="nav-chevron">›</span></button>
          <button data-page="gallery"><span class="nav-icon c-pink">🖼️</span>Gallery<span class="nav-chevron">›</span></button>
          <button data-page="diary"><span class="nav-icon c-orange">📔</span>Diary<span class="nav-chevron">›</span></button>
          <button data-page="world"><span class="nav-icon c-green">🌐</span>World<span class="nav-chevron">›</span></button>
          <button data-page="guestbook"><span class="nav-icon c-teal">✍️</span>Guestbook<span class="nav-chevron">›</span></button>
        </nav>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="modal-layer" id="contentLayer" aria-hidden="true">
    <article class="content-window modal-window">
      <div class="titlebar">
        <div class="traffic">
          <button class="t-red" data-close="contentLayer" aria-label="닫기"></button>
          <span class="t-yellow" aria-hidden="true"></span>
          <span class="t-green" aria-hidden="true"></span>
        </div>
        <button class="back-button" id="backToMenu" aria-label="메뉴로">‹</button>
        <span class="titlebar-title" id="contentTitle">About</span>
      </div>

      <div id="contentBody" class="content-body-wrap"></div>
    </article>
  </div>

  <script>const menuLayer = document.getElementById("menuLayer");
const contentLayer = document.getElementById("contentLayer");
const openMenu = document.getElementById("openMenu");
const contentTitle = document.getElementById("contentTitle");
const contentBody = document.getElementById("contentBody");
const backToMenu = document.getElementById("backToMenu");

const pages = {
  about: {
    title: "About",
    html: `
      <div class="feed-card">
        <div class="card-header"><span class="card-icon">•</span><span class="card-title">Intro</span></div>
        <section class="intro-card">
          <div class="fake-photo">YOUR<br>PHOTO</div>
          <div>
            <h2>hello, little visitor</h2>
            <p>여기는 나의 작은 인터넷 공간입니다. 좋아하는 것, 만든 것, 기록하고 싶은 것들을 천천히 모아두고 있어요.</p>
            <p>아직 준비 중인 페이지가 많지만, 이곳을 나만의 아카이브처럼 채워갈 예정이에요.</p>
            <div class="info-list">

let diaryDetailOpen = false;

function renderDiaryList() {
  diaryDetailOpen = false;
  contentTitle.textContent = "Diary";
  contentBody.innerHTML = `
    <nav class="diary-list">
      ${diaryEntries.map(entry => `<button data-diary="${entry.id}">${entry.label}</button>`).join("")}
    </nav>
  `;

  contentBody.querySelectorAll("[data-diary]").forEach(button => {
    button.addEventListener("click", () => {
      const entry = diaryEntries.find(item => item.id === button.dataset.diary);
      if (entry) renderDiaryDetail(entry);
    });
  });
}

function renderDiaryDetail(entry) {
  diaryDetailOpen = true;
  contentBody.innerHTML = `
    <div class="diary-note">
      <span class="diary-note-date">${entry.label}</span>
      <div class="diary-note-body">
        ${entry.html || `<p style="text-align:center;color:#c7c7cc;">아직 작성된 기록이 없어요.</p>`}
      </div>
      <div class="diary-note-compose">
        <span class="diary-note-cursor">|</span>
        <span class="diary-note-icon">${noteIconSvg}</span>
      </div>
    </div>
  `;
}

function openLayer(layer) {
  layer.classList.add("active");
  layer.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeLayer(layer) {
  layer.classList.remove("active");
  layer.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

openMenu.addEventListener("click", () => openLayer(menuLayer));

document.querySelectorAll("[data-page]").forEach(button => {
  button.addEventListener("click", () => {
    if (button.dataset.page === "diary") {
      renderDiaryList();
      closeLayer(menuLayer);
      openLayer(contentLayer);
      return;
    }

    const page = pages[button.dataset.page];
    if (!page) return;

    diaryDetailOpen = false;
    contentTitle.textContent = page.title;
    contentBody.innerHTML = page.html;

    closeLayer(menuLayer);
    openLayer(contentLayer);
  });
});

backToMenu.addEventListener("click", () => {
  if (diaryDetailOpen) {
    renderDiaryList();
    return;
  }

  closeLayer(contentLayer);
  openLayer(menuLayer);
});

document.querySelectorAll("[data-close]").forEach(button => {
  button.addEventListener("click", () => {
    closeLayer(document.getElementById(button.dataset.close));
  });
});

[menuLayer, contentLayer].forEach(layer => {
  layer.addEventListener("click", event => {
    if (event.target === layer) closeLayer(layer);
  });
});

document.addEventListener("keydown", event => {
  if (event.key !== "Escape") return;

  if (contentLayer.classList.contains("active")) {
    if (diaryDetailOpen) {
      renderDiaryList();
      return;
    }
    closeLayer(contentLayer);
    openLayer(menuLayer);
  } else if (menuLayer.classList.contains("active")) {
    closeLayer(menuLayer);
    openMenu.focus();
  }
});

/* menu bar live clock */
function updateMenubarClock() {
  const el = document.getElementById("menubarClock");
  if (!el) return;
  const now = new Date();
  el.textContent = now.toLocaleString("ko-KR", {
    weekday: "short",
    month: "numeric",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

updateMenubarClock();
setInterval(updateMenubarClock, 1000 * 15);
