<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>냥냥펀치 아카이브</title>
  <link rel="icon" type="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2FNgNja%2FdJMcaicHUwd%2FAAAAAAAAAAAAAAAAAAAAAHLnul0jT4DiIlfzZQGQlK306u37lcexyfI9cQlpeW4W%2Fimg.png%3Fcredential%3DyqXZFxpELC7KVnFOS48ylbz2pIh7yKj8%26expires%3D1788188399%26allow_ip%3D%26allow_referer%3D%26signature%3D2RrN%252BfJUKQwqlLQ7DoIZxz5eOS0%253D" href="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2FNgNja%2FdJMcaicHUwd%2FAAAAAAAAAAAAAAAAAAAAAHLnul0jT4DiIlfzZQGQlK306u37lcexyfI9cQlpeW4W%2Fimg.png%3Fcredential%3DyqXZFxpELC7KVnFOS48ylbz2pIh7yKj8%26expires%3D1788188399%26allow_ip%3D%26allow_referer%3D%26signature%3D2RrN%252BfJUKQwqlLQ7DoIZxz5eOS0%253D">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="menubar">
    <span class="menubar-brand"></span>
    <span class="menubar-right"><span id="menubarClock">--:--</span></span>
  </header>

  <main class="home">
    <button class="main-image-button" id="openMenu" aria-label="메뉴 열기">
      <img src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2FBBVDk%2FdJMcahSZW1K%2FAAAAAAAAAAAAAAAAAAAAAI_A8v87oKod9CbnnD_98XsakGLgKy4npxYWusTRT_Oo%2Fimg.jpg%3Fcredential%3DyqXZFxpELC7KVnFOS48ylbz2pIh7yKj8%26expires%3D1788188399%26allow_ip%3D%26allow_referer%3D%26signature%3DK55pB%252FFHhpNL2%252BJ7OTf%252BsQomkVQ%253D" alt="Main Image">
      <span class="click-hint">열어보기</span>
    </button>

    <p class="site-mark">SYNDROME ୨୧ LIA</p>
  </main>

  <nav class="dock" aria-label="빠른 이동">
    <button class="dock-about" data-page="about" title="About" aria-label="About">👤</button>
    <button class="dock-characters" data-page="characters" title="Characters" aria-label="Characters">🎭</button>
    <button class="dock-gallery" data-page="gallery" title="Gallery" aria-label="Gallery">🖼️</button>
    <button class="dock-diary" data-page="diary" title="Diary" aria-label="Diary">📔</button>
    <button class="dock-world" data-page="world" title="World" aria-label="World">🌐</button>
    <button class="dock-ooc" data-page="ooc" title="ooc" aria-label="ooc">✍️</button>
  </nav>

  <!-- MENU -->
  <div class="modal-layer" id="menuLayer" aria-hidden="true">
    <div class="menu-window modal-window">
      <div class="titlebar">
        <div class="traffic">
          <button class="t-red" data-close="menuLayer" aria-label="메뉴 닫기"></button>
          <span class="t-yellow" aria-hidden="true"></span>
          <span class="t-green" aria-hidden="true"></span>
        </div>
        <span class="titlebar-title">Marine Archive</span>
      </div>

      <div class="menu-body">
        <div class="profile-row">
          <div class="avatar"><img src="images/main.jpg" alt="profile"></div>
          <div class="who">@yourhandle<small>Marine Archive</small></div>
        </div>

        <nav class="nav-list">
          <button data-page="about"><span class="nav-icon c-blue">👤</span>About<span class="nav-chevron">›</span></button>
          <button data-page="characters"><span class="nav-icon c-purple">🎭</span>Characters<span class="nav-chevron">›</span></button>
          <button data-page="gallery"><span class="nav-icon c-pink">🖼️</span>Gallery<span class="nav-chevron">›</span></button>
          <button data-page="diary"><span class="nav-icon c-orange">📔</span>Diary<span class="nav-chevron">›</span></button>
          <button data-page="world"><span class="nav-icon c-green">🌐</span>World<span class="nav-chevron">›</span></button>
          <button data-page="ooc"><span class="nav-icon c-teal">✍️</span>ooc<span class="nav-chevron">›</span></button>
        </nav>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="modal-layer" id="contentLayer" aria-hidden="true">
    <article class="content-window modal-window">
      <div class="titlebar">
        <div class="traffic">
          <button class="t-red" data-close="contentLayer" aria-label="닫기"></button>
          <span class="t-yellow" aria-hidden="true"></span>
          <span class="t-green" aria-hidden="true"></span>
        </div>
        <button class="back-button" id="backToMenu" aria-label="메뉴로">‹</button>
        <span class="titlebar-title" id="contentTitle">About</span>
      </div>

      <div id="contentBody" class="content-body-wrap"></div>
    </article>
  </div>

  <script src="script.js"></script>
</body>
</html>
