<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>냥냥펀치 아카이브</title>
<link rel="icon" type="image/png" href="img/pav.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@0;1&family=Monsieur+La+Doulaise&family=Pinyon+Script&family=Noto+Sans+KR:wght@300;400&display=swap">
<style>
/* layout: an editorial portfolio index — a micro-type header grid, one large text index on the left, a small chrome object as the only ornament; images surface only under the cursor, content opens as a full-bleed sheet */
:root {
  --paper: #ffffff;
  --ink: #0f0f10;
  --mid: #9b9b9f;
  --hair: #ececee;
  --blue: #2d46ff;
  --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --serif: "Instrument Serif", "Times New Roman", serif;
  --ko: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans), var(--ko); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 1px solid var(--blue); outline-offset: 3px; }
@media (pointer: fine) { body, button, a { cursor: none; } }

.grain { position: fixed; inset: -50%; pointer-events: none; z-index: 50; opacity: .045; background-size: 160px; animation: grain 1s steps(6) infinite; }
@keyframes grain { 0% { transform: translate(0,0); } 33% { transform: translate(-3%, 2%); } 66% { transform: translate(2%, -3%); } }

.head { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: grid; grid-template-columns: 1fr auto; gap: 20px; padding: 18px 24px; font: 400 11px/1.35 var(--sans); z-index: 10; }
.head span { color: var(--mid); }
.head a { color: inherit; text-decoration: none; }

.index { position: fixed; left: 24px; top: 50%; transform: translateY(-46%); z-index: 3; margin: 0; padding: 0; list-style: none; }
.index li { display: block; }
.index button { display: flex; align-items: flex-start; gap: 10px; font: 400 clamp(46px, 6.6vw, 104px)/.92 var(--sans); letter-spacing: -.055em; transition: color .35s, transform .5s cubic-bezier(.2,.8,.2,1); }
.index sup { font: 400 11px/1 var(--mono); letter-spacing: 0; margin-top: .55em; color: var(--mid); }
.index em { font: italic 400 1em/.92 var(--serif); letter-spacing: -.02em; }
.index.dim button { color: #e2e2e5; }
.index.dim button.on { color: var(--ink); transform: translateX(14px); }
.index .lock::after { content: "*"; color: var(--blue); font-size: .5em; }

.float { position: fixed; left: 0; top: 0; width: 230px; aspect-ratio: 3/4; pointer-events: none; z-index: 2; opacity: 0; transition: opacity .3s; overflow: hidden; }
.float.on { opacity: 1; }
.float img { width: 100%; height: 100%; object-fit: cover; object-position: top; filter: saturate(.85) contrast(1.05); }
.float figcaption { position: absolute; left: 0; bottom: -22px; font: italic 400 15px var(--serif); }

.obj { position: fixed; right: 24px; top: 64px; width: min(420px, 34vw); aspect-ratio: .95; z-index: 4; }
.obj::before { content: ""; position: absolute; left: 22%; right: 22%; bottom: 14%; height: 12%; border-radius: 50%; background: radial-gradient(rgba(30,30,40,.16), transparent 70%); filter: blur(6px); pointer-events: none; }
.player { position: fixed; right: 24px; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 6px; font: 400 10px var(--mono); color: var(--ink); z-index: 6; }
.player button { width: 22px; height: 22px; display: grid; place-items: center; color: var(--ink); border-radius: 50%; }
.player button:hover { color: var(--blue); }
.player button.pp { width: 26px; height: 26px; border: 0; }

.player svg { width: 9px; height: 9px; fill: currentColor; }
.player .tt { white-space: nowrap; margin-left: 6px; letter-spacing: .02em; }
.player .tt a { color: var(--mid); text-decoration: none; margin-left: 6px; }
.player .tt a:hover { color: var(--blue); }

.meter { position: absolute; right: 0; top: 0; width: 60px; height: 2px; background: var(--hair); }
.meter i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .2s; }

.note { position: fixed; left: 50%; top: 22%; width: 220px; font: 300 12px/1.65 var(--ko); color: var(--ink); z-index: 3; }
.note b { font: italic 400 20px/1 var(--serif); display: block; margin-bottom: 8px; }

.ticker { position: fixed; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px); border-top: 1px solid var(--hair); overflow: hidden; white-space: nowrap; font: 400 11px/36px var(--mono); z-index: 5; background: var(--paper); }
.ticker div { display: inline-block; animation: tick 60s linear infinite; animation-play-state: paused; }
.ticker.playing div { animation-play-state: running; }
.ticker #lyr { display: inline-flex; gap: 42px; padding-left: 24px; animation: none; transition: transform .9s cubic-bezier(.2,.8,.2,1); }
.ticker #lyr span { margin: 0; color: #c7c7cb; transition: color .5s; white-space: nowrap; }
.ticker #lyr span.past { color: #a9a9ae; }
.ticker #lyr span.now { color: var(--ink); }
.ticker #lyr span.tag { color: var(--blue); }
.ticker span { margin-right: 36px; }
.ticker span i { font-style: normal; color: var(--blue); }
@keyframes tick { to { transform: translateX(-50%); } }

.cursor { position: fixed; left: 0; top: 0; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #86c4ee; opacity: .9; pointer-events: none; z-index: 60; transition: width .25s, height .25s, margin .25s; }
.cursor.big { width: 64px; height: 64px; margin: -32px; opacity: .55; }
@media (pointer: coarse) { .cursor { display: none; } }

.ribbon { position: fixed; left: 31vw; top: 79vh; width: min(560px, 38vw); z-index: 1; mix-blend-mode: multiply; pointer-events: none; transform: translate(-50%, -50%) translate(var(--rx, 0px), var(--ry, 0px)) rotate(calc(-80deg + var(--rr, 0deg))); }
.ribbon img { display: block; width: 100%; filter: url(#rwave); }
@media (max-width: 820px) { .ribbon { left: 50vw; top: 70vh; width: 70vw; } }
/* popup window */
.wbody { --accent: #2d46ff; --radius-card: 12px; --text: #0f0f10; }
.wbody .in.nopic { margin-top: 0; padding-top: 26px; }
.wbody .sub { font: 400 11px var(--mono); color: var(--mid); margin: -8px 0 22px; }
.wbody .back { font: 400 11px var(--mono); color: var(--mid); background: none; border: 0; padding: 0; margin-bottom: 18px; cursor: pointer; }
.wbody .back:hover { color: var(--ink); }
.gpick { display: grid; border-top: 1px solid var(--ink); }
.gpick button { display: grid; grid-template-columns: 40px 1fr auto; grid-template-rows: auto auto; column-gap: 12px; align-items: baseline; text-align: left; padding: 22px 0; border: 0; border-bottom: 1px solid var(--hair); background: none; cursor: pointer; color: var(--ink); transition: padding .35s; }
.gpick button:hover { padding-left: 10px; }
.gpick .gn { grid-row: 1 / 3; font: 400 10px var(--mono); color: var(--mid); }
.gpick b { font: italic 400 clamp(40px, 6vw, 60px)/1 var(--serif); letter-spacing: -.02em; font-weight: 400; }
.gpick small { grid-column: 2; font: 400 11px var(--mono); color: var(--mid); margin-top: 6px; }
.gpick .ga { grid-row: 1 / 3; grid-column: 3; align-self: center; font: 400 16px var(--mono); color: var(--mid); transition: color .3s, transform .3s; }
.gpick button:hover .ga { color: var(--blue); transform: translateX(4px); }
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.rows button { width: 100%; display: grid; grid-template-columns: 1fr 16px; gap: 10px; align-items: baseline; padding: 11px 0; border: 0; border-bottom: 1px solid var(--hair); background: none; text-align: left; cursor: pointer; font: 400 14px/1.5 var(--ko); color: var(--ink); transition: padding .3s; }
.rows button:hover { padding-left: 8px; }
.rows .rn { font: 400 10px var(--mono); color: var(--mid); }
.rows .rl { color: var(--blue); }
.pair-k { font: 400 11px var(--mono); letter-spacing: .2em; color: var(--mid); margin: 0 0 14px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.pc { display: block; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
.pimg { display: block; aspect-ratio: 3/4; overflow: hidden; border: 1px solid var(--ink); border-radius: 0; background: #111; }
.pimg img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; border-radius: 0; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.pc:hover .pimg img { transform: scale(1.04); }
.pfile { display: block; margin-top: 14px; min-height: 2.6em; font: 400 9.5px var(--mono); letter-spacing: .16em; color: var(--mid); }
.pcode { display: block; margin-top: 6px; font: 600 26px/1 var(--sans); letter-spacing: -.03em; }
.pname { display: block; margin-top: 4px; font: 500 12px var(--sans); color: var(--mid); letter-spacing: .04em; }
.pc dl { display: grid; grid-template-columns: 64px 1fr; margin: 14px 0 0; font: 400 13px/1 var(--sans); }
.pc dt, .pc dd { margin: 0; padding: 9px 0; border-top: 1px dotted #cfcfd3; }
.pc dt { font: 400 10px/1.3 var(--mono); letter-spacing: .16em; color: var(--mid); }
.pmore { display: block; margin-top: 12px; font: 400 10.5px var(--mono); color: var(--blue); opacity: 0; transition: opacity .3s; }
.pc:hover .pmore, .pc:focus-visible .pmore { opacity: 1; }
@media (max-width: 520px) { .pair { gap: 14px; } .pcode { font-size: 20px; } .pc dl { grid-template-columns: 50px 1fr; font-size: 12px; } }
.gtabs { display: flex; gap: 18px; margin: -6px 0 18px; font: 400 11px var(--mono); letter-spacing: .1em; }
.gtabs button { background: none; border: 0; padding: 0 0 4px; cursor: pointer; color: var(--mid); border-bottom: 1px solid transparent; }
.gtabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
.pager { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--hair); font: 400 11px var(--mono); color: var(--mid); }
.pager button { font: inherit; color: var(--ink); background: none; border: 0; padding: 4px 0; cursor: pointer; }
.pager button:disabled { color: #cfcfd3; cursor: default; }
.post { font: 400 13.5px/1.8 var(--ko); }
.post h2 { margin: 0 0 8px; color: var(--text); font: 600 16px/1.4 var(--ko); }
.post p { margin: 0 0 10px; color: #3c3c43; font-size: 13px; line-height: 1.75; }
.post img { max-width: 100%; }
.lock-badge { display: inline-flex; width: 13px; height: 13px; margin-right: 5px; vertical-align: -1px; color: #8a8a8e; }
.lock-badge svg { width: 100%; height: 100%; }
.feed-card{
  background: rgba(255, 255, 255, .6);
  border: 1px solid rgba(0, 0, 0, .06);
  border-radius: var(--radius-card);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .03);
  padding: 16px 18px;
  margin-bottom: 14px;
}
.card-header{
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}
.card-header .card-icon{
  color: var(--accent);
  font-size: 11px;
}
.card-header .card-title{
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  color: #8a8a8e;
  text-transform: uppercase;
}
.feed-card p:last-child{ margin-bottom: 0; }
.intro-card{
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 18px;
  align-items: center;
}
.fake-photo,
.character-card img{
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid rgba(0, 0, 0, .06);
  background: linear-gradient(160deg, #eef3fb, #fff);
}
.gallery-photo{
  display: block;
  max-width: 100%;
  max-height: min(52vh, 460px);
  width: auto;
  height: auto;
  margin: 0 auto 14px;
  border-radius: 10px;
  border: 1px solid rgba(0, 0, 0, .06);
}
.info-list{
  margin: 20px 0 0;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid rgba(0, 0, 0, .06);
  background: rgba(255, 255, 255, .6);
  font-size: 12px;
  line-height: 1.9;
}
.gallery-grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.character-grid{
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}
.character-grid .character-card{
  flex: 0 1 180px;
}
.character-card,
.gallery-item{
  display: block;
  width: 100%;
  padding: 8px;
  border-radius: 10px;
  border: 1px solid rgba(0, 0, 0, .06);
  background: rgba(255, 255, 255, .6);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background .15s ease, transform .15s ease;
}
.character-card:hover,
.gallery-item:hover{
  background: rgba(10, 132, 255, .06);
  transform: translateY(-1px);
}
.character-card h3{
  margin: 10px 0 3px;
  color: var(--text);
  font-size: 13px;
}
.character-card p{
  margin: 0;
  font-size: 10px;
  line-height: 1.6;
}
.gallery-item{
  aspect-ratio: 1 / 1;
  display: grid;
  place-items: center;
  overflow: hidden;
  position: relative;
  color: #9a9aa0;
  font-size: 12px;
}
.gallery-item:has(img){ padding: 0; }
.gallery-item img{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 9px;
}
.gallery-item img.thumb-blur{
  filter: blur(18px);
  transform: scale(1.1);
}
.playlist-card .track-thumb,
.playlist-card .track-player{
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 10px;
  margin-bottom: 12px;
  border: 1px solid rgba(0, 0, 0, .06);
  background: linear-gradient(160deg, #eef3fb, #fff);
  display: grid;
  place-items: center;
  color: #9a9aa0;
  font-size: 22px;
  overflow: hidden;
}
.playlist-card .track-player iframe{
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}
.playlist-card .track-list{
  list-style: none;
  margin: 0;
  padding: 0;
}
.playlist-card .track-list li{ border-bottom: 1px solid rgba(0, 0, 0, .05); }
.playlist-card .track-list li:last-child{ border-bottom: 0; }
.playlist-card .track-btn{
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 4px;
  border: 0;
  background: transparent;
  color: #3c3c43;
  font: inherit;
  font-size: 12.5px;
  text-align: left;
  cursor: pointer;
  border-radius: 6px;
  transition: background .15s ease, color .15s ease;
}
.playlist-card .track-btn:hover{ background: rgba(10, 132, 255, .06); }
.playlist-card .track-list li.active .track-btn{
  color: var(--accent);
  font-weight: 600;
}
.playlist-card .track-num{
  width: 18px;
  color: #a0a0a5;
  font-size: 11px;
}
.playlist-card .track-list li.active .track-num{ color: var(--accent); }
.entry-list{
  display: flex;
  flex-direction: column;
  border-top: 1px solid rgba(10, 132, 255, .18);
}
.entry-list button{
  width: 100%;
  padding: 20px 6px;
  border: 0;
  border-bottom: 1px solid rgba(10, 132, 255, .18);
  background: transparent;
  color: #8a8a8e;
  font: inherit;
  font-size: 14.5px;
  text-align: left;
  cursor: pointer;
  transition: color .15s ease, background .15s ease;
}
.entry-list button:hover{
  color: #3c3c43;
  background: rgba(10, 132, 255, .05);
}
.lock-badge{
  display: inline-flex;
  margin-right: 6px;
  color: #c7c7cc;
  vertical-align: -2px;
}
.lock-badge svg{ width: 12px; height: 12px; display: block; }
.gallery-item .lock-badge{
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 2;
  margin: 0;
  padding: 3px;
  color: #fff;
  background: rgba(0, 0, 0, .45);
  border-radius: 6px;
}
.lock-gate{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 48px 24px;
  text-align: center;
}
.lock-gate-icon{ width: 34px; height: 34px; color: #c7c7cc; }
.lock-gate-icon svg{ width: 100%; height: 100%; display: block; }
.lock-gate-hint{
  margin: 0;
  color: #8a8a8e;
  font-size: 13px;
}
.lock-gate-row{
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.lock-gate-input{
  padding: 8px 12px;
  border: 1px solid rgba(0, 0, 0, .12);
  border-radius: 8px;
  font: inherit;
  font-size: 13px;
  width: 160px;
}
.lock-gate-input:focus{ outline: 2px solid var(--accent); outline-offset: 1px; }
.lock-gate-submit{
  padding: 8px 16px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.lock-gate-submit:disabled{ opacity: .6; cursor: default; }
.lock-gate-error{
  margin: 4px 0 0;
  color: #ff3b30;
  font-size: 12px;
}
.blur-gate{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 48px 24px;
  text-align: center;
}
.blur-gate-icon{ font-size: 30px; }
.blur-gate-hint{
  margin: 0;
  color: #3c3c43;
  font-size: 14px;
  font-weight: 600;
}
.blur-gate-submit{
  margin-top: 4px;
  padding: 8px 24px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.note-card{
  border: 1px solid rgba(0, 0, 0, .1);
  border-radius: 14px;
  padding: 22px 24px 18px;
  background: rgba(255, 255, 255, .55);
}
.note-tag{
  display: inline-block;
  margin-bottom: 18px;
  padding: 2px 10px;
  border: 1px dashed rgba(10, 132, 255, .4);
  border-radius: 6px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
}
.note-body p{
  margin: 0 0 16px;
  color: #3c3c43;
  font-size: 13.5px;
  line-height: 1.9;
  white-space: pre-line;
}
.note-body p:last-child{ margin-bottom: 0; }
.note-gap{ margin-top: 26px !important; }
.note-dots{
  text-align: center;
  color: #c7c7cc;
  letter-spacing: 6px;
  margin: 22px 0;
  font-size: 13px;
}
.note-compose{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 22px;
  padding-top: 14px;
  border-top: 1px solid rgba(0, 0, 0, .08);
  color: #c7c7cc;
}
.note-cursor{ font-size: 13px; }
.note-icon{
  width: 18px;
  height: 18px;
  opacity: .5;
}
.note-icon svg{
  width: 100%;
  height: 100%;
  display: block;
}
@media (max-width: 600px){.intro-card{ grid-template-columns: 1fr; gap: 14px; }.fake-photo{ width: min(160px, 55vw); margin: 0 auto; }.gallery-grid{ grid-template-columns: repeat(2, 1fr); }.character-grid .character-card{ flex: 0 1 45%; }}

.wlayer { position: fixed; inset: 0; z-index: 40; background: rgba(240,240,242,.35); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; visibility: hidden; transition: opacity .35s, visibility .35s; }
.wlayer.open { opacity: 1; visibility: visible; }
.win { position: absolute; left: 50%; top: 50%; width: min(640px, calc(100vw - 32px)); height: auto; max-height: min(82vh, 760px); max-height: min(82dvh, 760px); display: flex; flex-direction: column; background: #fcfcfb; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgba(15,15,16,.08), 0 30px 80px -20px rgba(15,15,16,.28), 0 8px 20px -10px rgba(15,15,16,.15); transform: translate(-50%, -48%) scale(.96); transition: transform .5s cubic-bezier(.2,.9,.2,1); }
.wlayer.open .win { transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(1); }
.wbar { flex: none; display: grid; grid-template-columns: 70px 1fr 70px; align-items: center; height: 38px; padding: 0 14px; border-bottom: 1px solid var(--hair); font: 400 11px var(--mono); color: var(--mid); cursor: grab; user-select: none; touch-action: none; background: rgba(255,255,255,.7); }
.wbar.grab { cursor: grabbing; }
.wbar .dots { display: flex; gap: 7px; }
.wbar .d { width: 11px; height: 11px; border-radius: 50%; border: 1px solid #cfcfd3; background: #ececee; padding: 0; display: block; }
.wbar button.d { background: #dcdce0; cursor: pointer; }
.wbar button.d:hover { background: var(--ink); border-color: var(--ink); }
.wbar .wurl { text-align: center; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wbar .wn { text-align: right; }
.wbody { flex: 0 1 auto; min-height: 0; overflow: auto; padding: 0 0 20px; }

    ctl.onShot = function () { setTimeout(function () { open('chat'); }, 650); };
    ctl.onSpin = function (s) { charge = Math.max(0, Math.min(100, charge + (s > .2 ? 1.6 : -.6))); document.getElementById('meter').style.width = charge + '%'; if (charge >= 100) { charge = 0; open('forever'); } };
    var o = document.getElementById('obj'); o.querySelector('canvas').onmouseenter = function () { cur.classList.add('big'); }; o.querySelector('canvas').onmouseleave = function () { cur.classList.remove('big'); };
  }
});
</script>

<script>
// ======== the satin ribbon reacts to the pointer ========
(function () {
  var rb = document.getElementById('ribbon'), disp = document.getElementById('rdisp'), turb = document.getElementById('rturb');
  if (!rb || !disp) return;
  var amp = 0, tx = 0, ty = 0, rr = 0, vx = 0, vy = 0, mx = -1e4, my = -1e4, lx = -1e4, ly = -1e4, t = 0;
  addEventListener('pointermove', function (e) { mx = e.clientX; my = e.clientY; });
  (function loop() {
    t += .016;
    var r = rb.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var near = Math.max(0, 1 - Math.hypot(mx - cx, my - cy) / (Math.max(r.width, r.height) * .75));
    var speed = Math.min(60, Math.hypot(mx - lx, my - ly)); lx = mx; ly = my;
    amp += ((near * (18 + speed * 1.4)) - amp) * .08;
    vx += ((mx - cx) * near * .04 - tx) * .05; vy += ((my - cy) * near * .04 - ty) * .05; vx *= .82; vy *= .82; tx += vx; ty += vy;
    rr += (((mx - cx) / 60) * near - rr) * .05;
    disp.setAttribute('scale', (6 + amp).toFixed(1));
    turb.setAttribute('baseFrequency', (0.005 + Math.sin(t * .6) * .0015).toFixed(4) + ' ' + (0.011 + Math.cos(t * .5) * .002).toFixed(4));
    rb.style.setProperty('--rx', (tx + Math.sin(t * .4) * 8).toFixed(1) + 'px');
    rb.style.setProperty('--ry', (ty + Math.cos(t * .35) * 7).toFixed(1) + 'px');
    rb.style.setProperty('--rr', (rr + Math.sin(t * .3) * 1.5).toFixed(2) + 'deg');
    requestAnimationFrame(loop);
  })();
})();
</script>
