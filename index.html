  <header class="menubar">

    <button class="dock-ooc" data-page="ooc" title="ooc" aria-label="ooc"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l.9-4.2L15.4 5.3l3.3 3.3L8.2 19.1 4 20Z"/><path d="M13.6 6.9l3.3 3.3"/></svg></button>

    <div class="menu-window modal-window">
      <div class="titlebar">
        <div class="traffic">

          <span class="t-yellow" aria-hidden="true"></span>
          <span class="t-green" aria-hidden="true"></span>
        </div>
        <span class="titlebar-title">Marine Archive</span>
      </div>

      <div class="menu-body">
        <div class="profile-row">
          <div class="avatar"><img src="images/main.jpg" alt="profile"></div>
          <div class="who">@yourhandle<small>Marine Archive</small></div>

          <button data-page="diary"><span class="nav-icon c-orange"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.2C10.4 4.2 8 3.8 4.5 4v14.4c3.5-.2 5.9.2 7.5 1.2"/><path d="M12 5.2c1.6-1 4-1.4 7.5-1.2v14.4c-3.5-.2-5.9.2-7.5 1.2V5.2Z"/></svg></span>Diary<span class="nav-chevron">›</span></button>

  <!-- CONTENT -->
  <div class="modal-layer" id="contentLayer" aria-hidden="true">
    <article class="content-window modal-window">
      <div class="titlebar">
        <div class="traffic">
          <button class="t-red" data-close="contentLayer" aria-label="닫기"></button>
          <span class="t-yellow" aria-hidden="true"></span>
          <span class="t-green" aria-hidden="true"></span>
        </div>
        <button class="back-button" id="backToMenu" aria-label="메뉴로">‹</button>
        <span class="titlebar-title" id="contentTitle">About</span>
      </div>

      <div id="contentBody" class="content-body-wrap"></div>
    </article>

  <script src="script.js"></script>
