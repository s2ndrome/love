<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="home">
    <div class="deco deco-left">✦</div>
    <div class="deco deco-right">♡</div>

    <button class="main-image-button" id="openMenu" aria-label="메뉴 열기">
      <img src="images/main.jpg" alt="Main Image">
      <span class="click-hint">click me ♡</span>
    </button>

    <p class="site-mark">MARINE ARCHIVE</p>
  </main>

  <!-- MENU -->
  <div class="modal-layer" id="menuLayer" aria-hidden="true">
    <div class="menu-window modal-window">
      <button class="close-button" data-close="menuLayer" aria-label="메뉴 닫기">×</button>

      <div class="profile-mini">
        <div class="avatar"><img src="images/main.jpg" alt="profile"></div>
        <div class="handle">@yourhandle
          <small>MARINE ARCHIVE</small>
        </div>
      </div>

      <nav class="icon-nav" aria-label="빠른 이동">
        <button data-page="about" aria-label="ABOUT">♡</button>
        <button data-page="gallery" aria-label="GALLERY">✦</button>
        <button data-page="diary" aria-label="DIARY">✧</button>
      </nav>

      <div class="lace-line">♡ ✦ ♡ ✦ ♡ ✦ ♡</div>
      <div class="ribbon">MENU</div>
      <p class="modal-subtitle">welcome to my little archive</p>

      <nav class="menu-list">
        <button data-page="about">ABOUT <span>♡</span></button>
        <button data-page="characters">CHARACTERS <span>✦</span></button>
        <button data-page="gallery">GALLERY <span>♡</span></button>
        <button data-page="diary">DIARY <span>✧</span></button>
        <button data-page="world">WORLD <span>♡</span></button>
        <button data-page="guestbook">GUESTBOOK <span>✦</span></button>
      </nav>

      <div class="info-card">
        <p class="card-label">TODAY'S MOOD</p>
        <div class="info-row"><span>NAME</span><span>YOUR NAME</span></div>
        <div class="info-row"><span>SINCE</span><span>2026</span></div>
        <div class="info-row"><span>MOOD</span><span>♡ dreamy</span></div>
      </div>

      <div class="links-card">
        <p class="card-label">LINKS</p>
        <a class="link-item" href="#"><span class="lock">🔒</span> my other archive</a>
      </div>

      <div class="banner-strip">banner ♡ swap image here</div>

      <div class="modal-footer">choose a little door ♡</div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="modal-layer" id="contentLayer" aria-hidden="true">
    <article class="content-window modal-window">
      <button class="close-button" data-close="contentLayer" aria-label="본문 닫기">×</button>
      <button class="back-button" id="backToMenu">← MENU</button>

      <header class="content-header">
        <p class="tiny-label">MARINE ARCHIVE</p>
        <h1 id="contentTitle">ABOUT</h1>
        <div class="lace-line">♡ ─── ✦ ─── ♡</div>
      </header>

      <div id="contentBody" class="content-body"></div>
    </article>
  </div>

  <script src="script.js"></script>
</body>
</html>
