<div class="feed-card">
  <div class="card-header"><span class="card-icon">✎</span><span class="card-title">GUESTBOOK</span></div>
  <p>남기고 싶은 말을 적어주세요. 여기엔 안 뜨고, 저한테만 조용히 전달돼요.</p>

  <form class="message-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <input type="text" name="name" placeholder="이름 (선택)">
    <textarea name="message" placeholder="메시지" rows="5" required></textarea>
    <button type="submit">보내기</button>
    <p class="message-form-status" aria-live="polite"></p>
  </form>
</div>
