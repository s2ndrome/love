<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="embed.js?v=20261102a"></script>
<title>대화 관리 도구</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: 40px 20px; background: #f2f2f5; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #1d1d1f; }
  main { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 32px; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p.hint { margin: 0 0 20px; color: #6e6e73; font-size: 13px; line-height: 1.6; }
  label { display: block; margin: 16px 0 6px; font-size: 13px; font-weight: 600; }
  input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid rgba(0,0,0,.12); border-radius: 8px; font: inherit; font-size: 13px; }
  button { padding: 10px 20px; border: 0; border-radius: 8px; background: #0a84ff; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .status { margin-top: 14px; font-size: 12.5px; color: #6e6e73; white-space: pre-line; }
  .status.error { color: #d32f2f; }
  .status.done { color: #1a8a3e; font-weight: 600; }
  .list { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
  .talk { padding: 12px; border: 1px solid rgba(0,0,0,.1); border-radius: 10px; }
  .talk-h { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
  .talk-h b { flex: 1; font-size: 13px; }
  .talk-h button, .turn button, .adds button { padding: 5px 9px; font-size: 12px; background: #6e6e73; }
  .talk-h button.del, .turn button.x { background: #d32f2f; }
  .turn { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: start; margin-bottom: 6px; }
  .turn select { padding: 8px 6px; border: 1px solid rgba(0,0,0,.12); border-radius: 8px; font: inherit; font-size: 12.5px; background: #fff; }
  .turn select.l { background: #f4f9fd; border-color: #86c4ee; }
  .turn textarea { width: 100%; min-height: 38px; padding: 8px 10px; border: 1px solid rgba(0,0,0,.12); border-radius: 8px; font: inherit; font-size: 13px; line-height: 1.5; resize: vertical; }
  .adds { display: flex; gap: 6px; margin-top: 4px; }
  .adds button.l { background: #86c4ee; }
  .bottom { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .bottom button.sub { background: #6e6e73; }
  .empty { font-size: 13px; color: #6e6e73; margin: 10px 0 0; }
  .dirty { margin-left: auto; align-self: center; font-size: 12px; color: #d97706; }
</style>
</head>
<body>
<main>
  <h1>대화 관리 도구</h1>
  <p class="hint">홈 대문 사진 위젯의 <b>B</b> 칸에 나오는 신드롬 · 리아 대화예요. 대화 하나에 대사를 여러 줄 넣을 수 있고, 위젯에서 NEXT를 누르면 다음 대화로 넘어가요. 다 고친 다음 <b>저장</b>을 눌러야 홈에 반영돼요.</p>

  <label for="token">GitHub 토큰</label>
  <input type="password" id="token" placeholder="github_pat_...">

  <div class="list" id="list"></div>
  <div class="bottom">
    <button type="button" id="add-talk" class="sub">+ 새 대화</button>
    <button type="button" id="save-btn">저장</button>
    <span class="dirty" id="dirty" hidden>저장 안 한 수정이 있어요</span>
  </div>
  <p class="status" id="status"></p>
</main>

<script>
const OWNER = "s2ndrome", REPO = "love", BRANCH = "main";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents`;
const PATH = "data/talks.json";
const $ = id => document.getElementById(id);
const tokenInput = $("token"), status = $("status"), listEl = $("list");
const savedToken = localStorage.getItem("gh_token");
if (savedToken) tokenInput.value = savedToken;

// talks: [[["S", "대사"], ["L", "대사"]], ...]  S = 신드롬, L = 리아
let talks = [], sha = null, dirty = false;

function setStatus(t, k) { status.textContent = t; status.className = "status" + (k ? " " + k : ""); }
function esc(s) { return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function utf8ToBase64(str) { const b = new TextEncoder().encode(str); let s = ""; b.forEach(x => s += String.fromCharCode(x)); return btoa(s); }
function base64ToUtf8(b64) { const bin = atob(b64.replace(/\n/g, "")); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
function token() { return tokenInput.value.trim(); }
function headers() { return { Authorization: `Bearer ${token()}`, Accept: "application/vnd.github+json" }; }
function mark(on) { dirty = on; $("dirty").hidden = !on; }
addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

async function load() {
  if (!token()) { setStatus("먼저 GitHub 토큰을 입력해주세요.", "error"); return false; }
  localStorage.setItem("gh_token", token());
  setStatus("불러오는 중…");
  const r = await fetch(`${API}/${PATH}?ref=${BRANCH}`, { cache: "no-store", headers: headers() });
  if (r.status === 404) { talks = []; sha = null; render(); setStatus(""); return true; }
  if (!r.ok) { setStatus(`대화를 못 불러왔어요 (${r.status}) — 토큰을 확인해주세요.`, "error"); return false; }
  const f = await r.json(); sha = f.sha;
  try { talks = JSON.parse(base64ToUtf8(f.content)); } catch (e) { talks = []; }
  render(); mark(false); setStatus(""); return true;
}

function render() {
  if (!talks.length) { listEl.innerHTML = '<p class="empty">아직 대화가 없어요. 아래 "+ 새 대화"를 눌러 만들어주세요.</p>'; return; }
  listEl.innerHTML = talks.map((t, i) =>
    `<div class="talk" data-i="${i}"><div class="talk-h"><b>대화 ${String(i + 1).padStart(2, "0")}</b>` +
    `<button type="button" data-up ${i ? "" : "disabled"}>▲</button><button type="button" data-down ${i < talks.length - 1 ? "" : "disabled"}>▼</button><button type="button" class="del" data-del>삭제</button></div>` +
    t.map((u, j) => `<div class="turn" data-j="${j}"><select class="${u[0] === "L" ? "l" : ""}"><option value="S"${u[0] === "S" ? " selected" : ""}>SYNDROME</option><option value="L"${u[0] === "L" ? " selected" : ""}>LIA</option></select>` +
      `<textarea rows="1" placeholder="대사">${esc(u[1])}</textarea><button type="button" class="x" data-x title="이 줄 지우기">✕</button></div>`).join("") +
    `<div class="adds"><button type="button" data-add="S">+ 신드롬 대사</button><button type="button" class="l" data-add="L">+ 리아 대사</button></div></div>`
  ).join("");
  listEl.querySelectorAll("textarea").forEach(fit);
}
function fit(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; }

listEl.addEventListener("input", e => {
  const talk = e.target.closest(".talk"), turn = e.target.closest(".turn"); if (!talk || !turn) return;
  const u = talks[+talk.dataset.i][+turn.dataset.j];
  if (e.target.tagName === "TEXTAREA") { u[1] = e.target.value; fit(e.target); }
  mark(true);
});
listEl.addEventListener("change", e => {
  if (e.target.tagName !== "SELECT") return;
  const talk = e.target.closest(".talk"), turn = e.target.closest(".turn");
  talks[+talk.dataset.i][+turn.dataset.j][0] = e.target.value; e.target.className = e.target.value === "L" ? "l" : ""; mark(true);
});
listEl.addEventListener("click", e => {
  const b = e.target.closest("button"), talk = e.target.closest(".talk"); if (!b || !talk) return;
  const i = +talk.dataset.i, t = talks[i];
  if (b.hasAttribute("data-up")) [talks[i - 1], talks[i]] = [talks[i], talks[i - 1]];
  else if (b.hasAttribute("data-down")) [talks[i + 1], talks[i]] = [talks[i], talks[i + 1]];
  else if (b.hasAttribute("data-del")) { if (!confirm(`대화 ${String(i + 1).padStart(2, "0")}을(를) 지울까요?`)) return; talks.splice(i, 1); }
  else if (b.hasAttribute("data-x")) t.splice(+b.closest(".turn").dataset.j, 1);
  else if (b.dataset.add) { t.push([b.dataset.add, ""]); render(); mark(true); const tas = listEl.querySelectorAll(`.talk[data-i="${i}"] textarea`); tas[tas.length - 1].focus(); return; }
  else return;
  render(); mark(true);
});
$("add-talk").onclick = () => { talks.push([["S", ""], ["L", ""]]); render(); mark(true); const tas = listEl.querySelectorAll("textarea"); tas[tas.length - 2].focus(); };

$("save-btn").onclick = async () => {
  if (!token()) { setStatus("먼저 GitHub 토큰을 입력해주세요.", "error"); return; }
  // 빈 대사는 빼고, 대사가 하나도 없는 대화도 빼요
  const clean = talks.map(t => t.map(u => [u[0], u[1].trim()]).filter(u => u[1])).filter(t => t.length);
  const btn = $("save-btn"); btn.disabled = true;
  try {
    setStatus("저장 중…");
    const body = { message: `Update talks (${clean.length})`, content: utf8ToBase64(JSON.stringify(clean, null, 2) + "\n"), branch: BRANCH };
    if (sha) body.sha = sha;
    const r = await fetch(`${API}/${PATH}`, { method: "PUT", headers: headers(), body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (r.status === 409 || r.status === 422) throw new Error("그사이 다른 곳에서 대화가 바뀌었어요. 새로고침해서 다시 불러온 뒤 고쳐주세요.");
    if (!r.ok) throw new Error(`저장 실패 (${r.status}): ${d.message || ""}`);
    sha = d.content && d.content.sha; talks = clean; render(); mark(false);
    setStatus(`완료! 대화 ${clean.length}개를 저장했어요. 1~2분 후 사이트에 반영돼요.`, "done");
  } catch (e) { setStatus(e.message, "error"); }
  finally { btn.disabled = false; }
};
tokenInput.addEventListener("change", load);
if (token()) load();
</script>
</body>
</html>
